name: Chess Master CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Flutter Analyze, Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd chess_app
          flutter pub get

      - name: Run Static Analysis
        run: |
          cd chess_app
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run All Unit & Widget Tests
        run: |
          cd chess_app
          flutter test

      # The backend suite covers the entitlement and purchase-verification logic,
      # where a mistake either gives a paid feature away or revokes one someone
      # paid for. It needs Node and the backend's dependencies.
      #
      # Node 22 is a floor, not a preference: the Lichess puzzle import decodes a
      # multi-frame zstd dump through `zlib.zstdCompressSync` / `zstdDecompressSync`,
      # which exist only from v22.15.0 (and v23.8.0). On v20 they are undefined and
      # both the importer and its test die with "is not a function".
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: chess_backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd chess_backend
          npm ci

      - name: Run Backend Tests
        run: |
          cd chess_backend
          npm test

      - name: Build Android Release Split APK
        run: |
          cd chess_app
          flutter build apk --target-platform android-arm64 --split-per-abi --release --no-pub

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release-apk
          path: chess_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
