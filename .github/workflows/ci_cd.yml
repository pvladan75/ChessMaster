name: Mislisha CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# One run per branch. A push that supersedes another cancels it rather than
# racing it: on 18.9.2026 the run started at 18:16 was still frozen in the
# backend suite when 18:30 pushed, and both sat there until the six-hour job
# limit. The cost is that a superseded push loses its APK artifact — the
# commit that replaced it builds one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Flutter Analyze, Test & Build APK
    runs-on: ubuntu-latest

    # A run that hangs must cost minutes, not the six-hour job limit. Four of
    # the seven runs between 18.9.2026 and 19.9.2026 stopped producing output a
    # few seconds into `npm test` and sat there until GitHub killed them; a
    # normal run of this job is under 25 minutes, of which the backend suite is
    # under a minute. These ceilings are deliberately loose — they are here to
    # end a freeze, not to police a slow run.
    timeout-minutes: 45

    # A throwaway PostgreSQL for the backend tests that must prove SQL — a
    # CHECK, a partial index, a WHERE clause — which the stub pools cannot see
    # (chess_backend/test/support/pgTestDb.js). Nothing here is a secret: the
    # container exists for the length of this job and holds only test rows.
    # Without TEST_DATABASE_URL those tests fail in CI rather than skip.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd chess_app
          flutter pub get

      - name: Run Static Analysis
        run: |
          cd chess_app
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run All Unit & Widget Tests
        run: |
          cd chess_app
          flutter test

      # The backend suite covers the entitlement and purchase-verification logic,
      # where a mistake either gives a paid feature away or revokes one someone
      # paid for. It needs Node and the backend's dependencies.
      #
      # Node 22 is a floor, not a preference: the Lichess puzzle import decodes a
      # multi-frame zstd dump through `zlib.zstdCompressSync` / `zstdDecompressSync`,
      # which exist only from v22.15.0 (and v23.8.0). On v20 they are undefined and
      # both the importer and its test die with "is not a function".
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: chess_backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd chess_backend
          npm ci

      - name: Run Backend Tests
        timeout-minutes: 10
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          # Every child `node --test` starts inherits this. A test process still
          # alive after twenty seconds prints what is holding it open — the one
          # hang of 19.9.2026 that would not reproduce off this runner.
          NODE_OPTIONS: --require ./test/support/whatHoldsMe.js
        run: |
          cd chess_backend
          npm test

      - name: Build Android Release Split APK
        run: |
          cd chess_app
          flutter build apk --target-platform android-arm64 --split-per-abi --release --no-pub

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-arm64-v8a-release-apk
          path: chess_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
