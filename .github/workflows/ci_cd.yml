name: Chess Master CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Flutter Analyze, Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd chess_app
          flutter pub get

      - name: Run Static Analysis
        run: |
          cd chess_app
          flutter analyze --no-fatal-infos

      - name: Run All Unit & Widget Tests
        run: |
          cd chess_app
          flutter test

      - name: Build Android Release Split APK
        run: |
          cd chess_app
          flutter build apk --target-platform android-arm64 --split-per-abi --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release-apk
          path: chess_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
