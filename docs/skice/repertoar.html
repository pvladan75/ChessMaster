<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Repertoire sketch</title>
<!--
  The repertoire build screen, as it could be. Rendered to PNG with headless
  Edge; the query string picks the variant and the window:

    ?v=A&w=1536&h=792   Preparation's shape — tree on top, book | engine under it
    ?v=B&w=1536&h=792   three columns — board | book and engine | tree

  The board is sized by one rule in both: the height the window has left under
  the bar and the move strip, and never more than the width the rest leaves.
-->
<style>
:root{
  --canvas:#0f172a; --surface:#1e293b; --raised:#334155; --recess:#020617;
  --border:rgba(255,255,255,.12); --borderS:rgba(255,255,255,.24);
  --t1:#f8fafc; --t2:#cbd5e1; --t3:#94a3b8;
  --accent:#2dd4bf; --brand:#a78bfa; --warn:#fbbf24; --info:#38bdf8;
}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--t1);
  font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;overflow:hidden}
#cap{height:44px;display:flex;align-items:center;gap:18px;padding:0 14px;
  background:#fff;color:#111;font-size:15px;white-space:nowrap;overflow:hidden}
#cap b{font-size:16px}
#cap .big{font-weight:700;border:2px solid #111;border-radius:6px;padding:2px 8px}
#win{position:relative;background:var(--canvas);overflow:hidden}
.bar{height:56px;background:var(--canvas);display:flex;align-items:center;
  padding:0 16px;gap:14px;border-bottom:1px solid var(--border);white-space:nowrap}
.title{font-size:20px;font-weight:600}
.sub{color:var(--t1);font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.ic{font-size:20px;color:var(--t1);width:32px;text-align:center}
.btn{height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;
  border:1px solid var(--borderS);border-radius:18px;color:var(--t1);background:transparent;
  font-size:13px;white-space:nowrap}
.btn.icon{width:36px;padding:0;justify-content:center;font-size:16px;border:none}
.board{position:relative;border-radius:2px;overflow:hidden}
.sq{position:absolute;display:flex;align-items:center;justify-content:center;line-height:1}
.pw{color:#fff;-webkit-text-stroke:1.4px #000}
.pb{color:#141414;text-shadow:0 0 2px #fff,0 0 2px #fff}
.pw,.pb{font-family:"Segoe UI Symbol"}
.coord{position:absolute;color:var(--t3);font-size:12px}
.strip{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;
  background:var(--surface);border-radius:10px}
.strip .lab{font-weight:600;font-size:15px}
.dim{color:var(--t3);font-size:12px}
.micro{color:var(--t3);font-size:11.5px;line-height:1.35}
.box{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.bh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.pc{padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--borderS);border-radius:8px;padding:6px 9px;font-size:12.5px;
  color:var(--t1);background:var(--raised)}
.lchip{border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12.5px;background:rgba(30,41,59,.5)}
.lchip.cur{border-color:var(--accent);background:rgba(45,212,191,.22);font-weight:700}
.eline{display:flex;gap:8px;align-items:center;padding:3px 0;white-space:nowrap;overflow:hidden;font-size:13px}
.eline b{width:48px;flex:none}
.eline span.m{width:40px;flex:none}
.eline span.c{color:var(--t3);font-size:12px;overflow:hidden;text-overflow:ellipsis;flex:1}
.dial{border:1px solid var(--borderS);border-radius:6px;padding:3px 8px;font-size:12px}
.tree{position:relative;background:var(--canvas);border-radius:8px;flex:1;min-height:0;overflow:hidden;
  border:1px solid var(--border)}
.node{position:absolute;height:30px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;border:1.5px solid var(--borderS);background:var(--surface);color:var(--t1);
  white-space:nowrap;border-radius:7px}
.node.opp{border-radius:15px;font-weight:600}
.node.act{border:2.5px solid var(--accent);background:rgba(45,212,191,.28)}
.node.ask{border:2.5px solid #fff}
.zoom{position:absolute;right:8px;top:8px;width:40px;border:1px solid var(--border);border-radius:8px;
  background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0;
  color:var(--t2);font-size:15px}
.seg{display:inline-flex;gap:6px;font-size:12px;font-weight:400}
.seg span{padding:4px 9px;border:1px solid var(--borderS);border-radius:6px;color:var(--t2)}
.seg span.sel{border-color:var(--accent);color:var(--t1);background:rgba(45,212,191,.18)}
.q{font-weight:700;font-size:14.5px}
.line{color:var(--accent);font-size:12.5px}
.tag{position:absolute;background:#fde047;color:#111;font-weight:700;font-size:13px;
  padding:3px 8px;border-radius:5px;z-index:30;white-space:nowrap}
</style>
</head>
<body>
<div id="cap"></div>
<div id="win"></div>
<script>
const Q = new URLSearchParams(location.search);
const V = Q.get('v') || 'A';
const W = +(Q.get('w') || 1536), H = +(Q.get('h') || 792);
const BAR = 56, PAD = 8, GAP = 12, ROWGAP = 4, STRIP = 48;
const BODY = H - BAR;

/* today's rule, `_boardSize` in repertoire_build_screen.dart */
function today(w, body){
  const byWidth = Math.min(Math.max(w * 0.42, 420), 620) - 24;
  return Math.round(Math.min(Math.max(Math.min(byWidth, body * 0.5), 200), 560));
}

/* the proposed rule: the height the body has left, never more than the width allows */
const MID = 380;                        // B's middle column
function layout(){
  const byHeight = BODY - 2 * PAD - ROWGAP - STRIP;
  if (V === 'B'){
    const byWidth = W - 2 * PAD - 2 * GAP - MID - 420;
    const board = Math.floor(Math.min(byHeight, byWidth));
    return {board, mid: MID, tree: W - 2 * PAD - 2 * GAP - MID - board};
  }
  const minPane = W < 1000 ? 400 : 420;
  const byWidth = W - 2 * PAD - GAP - minPane;
  const board = Math.floor(Math.min(byHeight, byWidth));
  return {board, pane: W - 2 * PAD - GAP - board};
}
const L = layout();

/* ---------- the board: 1.e4 e5 2.Nf3 Nc6 3.Bc4 Bc5 4.b4 Bxb4 5.c3 Ba5 ---------- */
const FEN = 'r1bqk1nr/pppp1ppp/2n5/b3p3/2B1P3/2P2N2/P2P1PPP/RNBQK2R';
const GLYPH = {k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
function xy(sq){ return [sq.charCodeAt(0) - 97, 8 - (+sq[1])]; }
function board(outer){
  const gut = 18, size = outer - gut, s = size / 8;
  let h = '';
  const rows = FEN.split('/');
  const last = ['b4','a5'].map(xy);
  for (let r = 0; r < 8; r++){
    let f = 0;
    for (const ch of rows[r]){
      const n = +ch, cells = n ? n : 1;
      for (let i = 0; i < cells; i++, f++){
        const dark = (r + f) % 2 === 1;
        const isLast = last.some(p => p[0] === f && p[1] === r);
        const bg = isLast ? (dark ? '#a07a50' : '#d9c08e') : (dark ? '#b58763' : '#f0dab5');
        const piece = n ? '' :
          `<span class="${ch === ch.toUpperCase() ? 'pw' : 'pb'}" style="font-size:${s*0.8}px">${GLYPH[ch.toLowerCase()]}&#xFE0E;</span>`;
        h += `<div class="sq" style="left:${gut+f*s}px;top:${r*s}px;width:${s}px;height:${s}px;background:${bg}">${piece}</div>`;
      }
    }
  }
  for (let r = 0; r < 8; r++) h += `<div class="coord" style="left:3px;top:${r*s+s/2-8}px">${8-r}</div>`;
  for (let f = 0; f < 8; f++) h += `<div class="coord" style="left:${gut+f*s+s/2-4}px;top:${size+1}px">${'abcdefgh'[f]}</div>`;
  return `<div style="position:relative;width:${outer}px;height:${outer}px">${h}</div>`;
}

function strip(width){
  return `<div class="strip" style="width:${width}px">
    <span class="ic">⏮</span><span class="ic">‹</span><span class="lab">Move 10 of 17</span>
    <span class="ic">›</span><span class="ic">⏭</span>
    <span class="ic" style="color:var(--t2)">⑂</span><span class="ic" style="color:var(--info)">▤</span>
    <span class="ic" style="color:var(--accent)">✦</span></div>`;
}

/* ---------- the tree ---------- */
function treeCard(w, h){
  const legend = `Beside the opponent's move is how often it is played in master games. ★ is your main move, ? is a position where you have not chosen a move yet. Tap a move to go there, and long press (or right click) to delete it or make it your main move.`;
  // x, y as fractions of a 760 x 560 drawing, centred on the active card
  const N = [
    ['▦', 0.50, 0.03, 'mine'],
    ['5. c3 ★', 0.50, 0.19, 'mine'],
    ['5... Ba5 49%', 0.22, 0.36, 'opp act'],
    ['5... Be7 39%', 0.60, 0.36, 'opp'],
    ['5... Bc5 6%', 0.92, 0.36, 'opp'],
    ['6. d4 ★', 0.22, 0.53, 'mine'],
    ['6. d4 ★', 0.60, 0.53, 'mine'],
    ['6. d4 ★', 0.92, 0.53, 'mine'],
    ['6... d6 51%', 0.08, 0.70, 'opp'],
    ['6... exd4 42%', 0.36, 0.70, 'opp'],
    ['6... Na5 86% ?', 0.60, 0.70, 'opp ask'],
    ['6... exd4 90%', 0.92, 0.70, 'opp'],
    ['7. Qb3 ★', 0.08, 0.87, 'mine'],
    ['7. O-O ★', 0.36, 0.87, 'mine'],
    ['7. cxd4 ★', 0.92, 0.87, 'mine'],
  ];
  const E = [[0,1],[1,2],[1,3],[1,4],[2,5],[3,6],[4,7],[5,8],[5,9],[6,10],[7,11],[8,12],[9,13],[11,14]];
  const gw = w - 26, top = 110;
  const gh = h - top - 14;
  const DW = Math.max(gw - 50, 640), DH = Math.max(gh - 10, 520);
  // The active card in the middle of the view, as `_ensureActiveVisible`
  // keeps it; a drawing wider than the view runs off both sides.
  const off = (gw - 50) / 2 - N[2][1] * DW;
  const px = n => off + n[1] * DW, py = n => 12 + n[2] * DH;
  let lines = '';
  for (const [a, b] of E){
    const A = N[a], B = N[b];
    const act = (a === 1 && b === 2) || (a === 0 && b === 1);
    lines += `<path d="M${px(A)},${py(A)+30} C${px(A)},${py(A)+55} ${px(B)},${py(B)-25} ${px(B)},${py(B)}"
      stroke="${act ? '#2dd4bf' : '#64748b'}" stroke-width="${act ? 3 : 1.6}" fill="none"/>`;
  }
  let nodes = '';
  for (const n of N){
    const nw = n[0] === '▦' ? 110 : 128;
    nodes += `<div class="node ${n[3]}" style="left:${px(n)-nw/2}px;top:${py(n)}px;width:${nw}px">${n[0]}</div>`;
  }
  return `<div style="display:flex;flex-direction:column;gap:6px;width:${w}px;height:${h}px;min-height:0">
    <div class="micro">${legend}</div>
    <div style="display:flex;align-items:center;gap:18px;font-size:13.5px;font-weight:600;color:var(--accent)">
      <span>⇕ Show only from this position</span>
      <span class="micro" style="color:var(--warn);font-weight:400">Drawing is truncated at 16 plies — repertoire goes deeper.</span></div>
    <div class="box" style="flex:1;padding:10px 12px;gap:8px">
      <div class="bh" style="justify-content:space-between"><span>⊞ Variation Tree</span>
        <span class="seg"><span class="sel">Visual</span><span>PGN</span><span style="border:none">⤢</span></span></div>
      <div class="tree"><svg style="position:absolute;inset:0" width="100%" height="100%">${lines}</svg>${nodes}
        <div class="zoom"><span>+</span><span>−</span><span>◎</span><span>↻</span><span>⇆</span></div></div>
    </div>
  </div>`;
}

/* ---------- what belongs to the position on the board ---------- */
const QUESTION = `
  <div class="line">1.e4 e5 2.Nf3 Nc6 3.Bc4 Bc5 4.b4 Bxb4 5.c3 Ba5</div>
  <div class="q">What do you play with White?</div>
  <div class="micro">Every move in your repertoire is one you played on the board. The book beside it is a reference: when you play a move, only its most played reply is added for you. · decided 21</div>`;
const LINESTRIP = `<div style="display:flex;gap:4px;align-items:center">
  <span class="lchip">c3 ★</span><span class="dim">›</span><span class="lchip cur">Ba5 49%</span>
  <span class="dim">›</span><span class="lchip">d4 ★</span></div>`;
const BOOK = `<div class="bh" style="color:var(--brand)">⚲ Opening book <span class="dim" style="font-weight:400">518 games</span></div>
  <div class="chips"><span class="chip">d4 ★ (92%) · 474</span><span class="chip">O-O (5%) · 24</span><span class="chip">Qb3 (4%) · 20</span></div>`;
const KEPT = `<div class="bh" style="color:var(--accent);margin-top:4px">Your moves here</div>
  <div class="micro">Star marks the main move — drill will ask for this.</div>
  <div style="display:flex;align-items:center;gap:10px;font-size:14px"><span style="color:var(--accent)">★</span><b>d4</b><span class="dim">main</span><span class="sp"></span><span class="dim">✕</span></div>`;
function ENGINE(askInHeader){
  const l = (e, m, c) => `<div class="eline"><b>${e}</b><span class="m">${m}</span><span class="c">${c}</span><span class="dim">d22</span></div>`;
  return `<div class="bh" style="color:var(--accent)">⚙ Engine <span class="sp"></span>${askInHeader ? '<span class="btn" style="height:30px">Ask engine</span>' : ''}</div>
    <div class="micro">Local engine. Evaluation is from White's perspective.</div>
    <div style="display:flex;gap:8px;align-items:center;font-size:12px">Depth <span class="dial">22 ▾</span> Lines <span class="dial">3 ▾</span> <span class="dim">↻</span></div>
    <div style="font-size:12px">Saved: +0.41 · depth 22 · 28.9.2026.</div>
    ${l('+0.41', 'd4', 'exd4 O-O Nge7 cxd4 d5 exd5 Nxd5 Ba3')}
    ${l('+0.18', 'O-O', 'd6 d4 Bb6 a4 a6 Qb3 Qf6')}
    ${l('+0.02', 'Qb3', 'Qf6 O-O Bb6 d4 Na5 Qa4')}
    <div class="micro">Tap a line to play its first move.</div>`;
}

/* ---------- the window ---------- */
const win = document.getElementById('win');
win.style.width = W + 'px'; win.style.height = H + 'px';
const bar = `<div class="bar"><span class="ic">←</span>
  <span class="title">Italian Game: Evans Gambit Accepted — White</span>
  ${W >= 1200 ? '<span class="sub">C52 · Italian Game: Evans Gambit, Main Line</span>' : ''}
  <span class="sp"></span><span class="ic">🔊&#xFE0E;</span><span class="ic">▦</span></div>`;

const inner = BODY - 2 * PAD;
const boardCol = `<div style="display:flex;flex-direction:column;gap:${ROWGAP}px;flex:none">
  ${board(L.board)}${strip(L.board)}</div>`;

let body;
if (V === 'B'){
  body = `<div style="display:flex;gap:${GAP}px;padding:${PAD}px;height:${BODY}px">
    ${boardCol}
    <div class="box" style="width:${L.mid}px;flex:none;height:${inner}px">
      <div class="pc" style="flex:1">${LINESTRIP}${QUESTION}
        <div style="height:1px;background:var(--border);margin:2px 0"></div>${BOOK}${KEPT}
        <div style="height:1px;background:var(--border);margin:2px 0"></div>${ENGINE(false)}</div>
      <div style="display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--border)">
        <span class="btn">Ask engine</span><span class="btn">Next position</span><span class="btn">Drill this branch</span></div>
    </div>
    ${treeCard(L.tree, inner)}
  </div>`;
} else {
  const beside = L.pane >= 640;
  const low = beside ? 300 : Math.round(inner * 0.5);
  const treeH = inner - low - GAP;
  const header = `<div style="display:flex;align-items:flex-start;gap:12px">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">${QUESTION}</div>
      ${beside ? '<span class="btn">Next position</span><span class="btn">Drill this branch</span>' : ''}</div>`;
  const lower = beside
    ? `<div style="height:${low}px;display:flex;flex-direction:column;gap:8px">
        ${header}
        <div style="flex:1;display:flex;gap:${GAP}px;min-height:0">
          <div class="box" style="flex:1"><div class="pc">${LINESTRIP}${BOOK}${KEPT}</div></div>
          <div class="box" style="flex:1"><div class="pc">${ENGINE(true)}</div></div>
        </div></div>`
    : `<div class="box" style="height:${low}px"><div class="pc">${header}${LINESTRIP}${BOOK}${KEPT}${ENGINE(true)}</div></div>`;
  body = `<div style="display:flex;gap:${GAP}px;padding:${PAD}px;height:${BODY}px">
    ${boardCol}
    <div style="width:${L.pane}px;flex:none;display:flex;flex-direction:column;gap:${GAP}px;height:${inner}px">
      ${treeCard(L.pane, treeH)}${lower}</div>
  </div>`;
}
win.innerHTML = bar + body;

const cap = document.getElementById('cap');
const name = V === 'B' ? 'B — three columns: board · book and engine · tree'
                       : 'A — like Preparation: tree on top, book and engine under it';
cap.innerHTML = `<b>${name}</b><span>window ${W} × ${H}</span>
  <span class="big">board ${L.board}</span><span>today ${today(W, BODY)}</span>
  <span>no comment column — the comment sits with the book when one is written</span>`;
document.body.style.width = W + 'px';
</script>
</body>
</html>
