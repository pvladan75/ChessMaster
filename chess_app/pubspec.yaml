name: chess_app
description: A new Flutter chess application.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  socket_io_client: ^3.0.0
  flutter_chess_board: ^1.0.1
  chess_vectors_flutter: ^1.1.0
  http: ^1.2.0
  chess: ^0.7.0
  file_picker: ^11.0.0
  stockfish: ^1.4.0
  shared_preferences: ^2.2.0
  agora_rtc_engine: ^6.6.3
  permission_handler: ^13.0.0
  google_sign_in: ^7.0.0
  audioplayers: ^6.0.0
  flutter_riverpod: ^3.0.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/puzzles/easy_puzzles.json
    - assets/puzzles/medium_puzzles.json
    - assets/puzzles/hard_puzzles.json
    - assets/puzzles/mate_puzzles_db.json
    - assets/data/eco_openings.json

dependency_overrides:
  ffi: ^2.2.0
  # permission_handler_android 14.0.0 has a broken build.gradle.kts (uses the
  # `kotlin { compilerOptions {...} }` DSL without applying the Kotlin plugin),
  # pin to the last working release until upstream fixes it.
  permission_handler_android: 13.0.1
