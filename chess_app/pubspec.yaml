name: chess_app
description: A new Flutter chess application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  socket_io_client: ^3.0.0
  flutter_chess_board: ^1.0.1
  http: ^1.2.0
  chess: ^0.7.0
  file_picker: ^8.0.0
  stockfish: ^1.4.0
  shared_preferences: ^2.2.0
  agora_rtc_engine: ^6.6.3
  permission_handler: ^12.0.1
  google_sign_in: ^6.2.1
  audioplayers: ^6.0.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  ffi: ^2.2.0
