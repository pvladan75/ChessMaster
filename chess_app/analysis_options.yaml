include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    unused_field: ignore
    unused_element: ignore
    unused_local_variable: ignore
    avoid_print: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Vendored third-party code (the Stockfish plugin, moved to SF19 by hand).
    - packages/**

linter:
  rules:
    # avoid_print: false
